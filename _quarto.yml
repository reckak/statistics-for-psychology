project:
  type: book
  output-dir: _book
  execute-dir: project
  pre-render:
    - Rscript --vanilla scripts/render-figures.R
  post-render:
    - node scripts/style-html-tables.cjs
  render:
    - index.qmd
    - quarto/*.qmd
  resources:
    - assets/
    - data/*.xlsx
    - "!data/*.csv"
    - "!sources/**"
    - "!quarto/README.md"
    - "!quarto/_verification/**"

book:
  title: "Základy statistiky pro psychology 1"
  language: cs
  site-url: https://reckak.github.io/statistics-for-psychology/
  repo-url: https://github.com/reckak/statistics-for-psychology
  sidebar:
    style: floating
    search: true
  page-footer:
    center: "© 2026 Karel Rečka · Text a data: [CC BY 4.0](https://github.com/reckak/statistics-for-psychology/blob/main/LICENSE-TEXT.md) · Kód: [MIT](https://github.com/reckak/statistics-for-psychology/blob/main/LICENSE)"
  chapters:
    - index.qmd
    - part: "Výkladové kapitoly"
      chapters:
        - quarto/kapitola_01.qmd
        - quarto/kapitola_02.qmd
        - quarto/kapitola_03.qmd
        - quarto/kapitola_04.qmd
        - quarto/kapitola_05.qmd
        - quarto/kapitola_06.qmd
        - quarto/kapitola_07.qmd
    - part: "Literatura a přehledy"
      chapters:
        - quarto/literatura.qmd
        - quarto/slovnicek.qmd
        - quarto/znaceni.qmd
        - quarto/excel.qmd

lang: cs
bibliography: references.bib
# Use the same citation set in every chapter so APA year suffixes agree with the shared bibliography.
nocite: '@*'
csl: styles/apa.csl
execute:
  echo: false
  warning: false
  message: false
filters:
  - filters/table-style.lua
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-location: right
    toc-title: "Obsah kapitoly"
    toc-depth: 2
    toc-expand: 1
    number-sections: true
    code-copy: true
    include-after-body: assets/after-body.html
    html-math-method: mathml
    # Clicking a figure opens it enlarged with its caption (GLightbox).
    lightbox:
      match: auto
      effect: zoom
      desc-position: bottom
      loop: false
    # Keep Czech decimal numbers written as 0{,}841 in one MathML <mn>.
    filters:
      - filters/desetinna-carka.lua
