project:
  type: book
  output-dir: _book
  execute-dir: project
  render:
    - index.qmd
    - quarto/*.qmd
  resources:
    - assets/
    - data/
    - "!sources/**"
    - "!quarto/README.md"
    - "!quarto/_verification/**"

book:
  title: "Základy statistiky pro psychology 1"
  language: cs
  site-url: https://reckak.github.io/statistics-for-psychology/
  repo-url: https://github.com/reckak/statistics-for-psychology
  sidebar:
    style: floating
    search: true
  chapters:
    - index.qmd
    - quarto/kapitola_01.qmd
    - quarto/slovnicek.qmd
    - quarto/znaceni.qmd
    - quarto/excel.qmd

lang: cs
bibliography: references.bib
execute:
  echo: false
  warning: false
  message: false
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-location: right
    toc-title: "Obsah kapitoly"
    toc-depth: 2
    toc-expand: 1
    number-sections: true
    code-copy: true
    include-after-body: assets/after-body.html
    html-math-method: mathjax
