project:
  type: default
  render:
    - kniha.qmd
title: "Základy statistiky pro psychology"
subtitle: "Verze PDF, stav k @DATE@"
author: "Karel Rečka"
lang: cs
bibliography: references.bib
csl: apa.csl
link-citations: true
filters:
  - at: pre-ast
    path: book.lua
  - at: pre-ast
    path: typography.lua
  - at: pre-ast
    path: table-style.lua
format:
  typst:
    papersize: a4
    fontsize: 11pt
    mainfont: Libertinus Serif
    toc: true
    toc-title: Obsah
    toc-depth: 1
    number-sections: true
    section-numbering: "1.1.1"
    citeproc: true
    keep-typ: true
    margin:
      x: 20mm
      y: 20mm
    include-before-body: layout.typ
crossref:
  chapters: true
execute:
  echo: false
  warning: false
  message: false
